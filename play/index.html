<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Acronym Crossword</title>
    <link rel="stylesheet" href="../assets/crossword.css">
</head>
<body>
    <h1 id="puzzle-title">The Acronym Crossword</h1>

    <nav class="puzzle-selector" id="puzzle-selector" aria-labelledby="puzzle-selector-title">
        <h2 id="puzzle-selector-title">Choose a puzzle</h2>
        <div class="puzzle-tile-grid">
            <a class="puzzle-tile" data-puzzle="week1" href="?puzzle=week1">1</a>
            <a class="puzzle-tile" data-puzzle="week2" href="?puzzle=week2">2</a>
            <a class="puzzle-tile" data-puzzle="week3" href="?puzzle=week3">3</a>
            <a class="puzzle-tile" data-puzzle="week4" href="?puzzle=week4">4</a>
            <a class="puzzle-tile" data-puzzle="week5" href="?puzzle=week5">5</a>
            <a class="puzzle-tile" data-puzzle="week6" href="?puzzle=week6">6</a>
            <a class="puzzle-tile" data-puzzle="week7" href="?puzzle=week7">7</a>
            <a class="puzzle-tile" data-puzzle="week8" href="?puzzle=week8">8</a>
            <a class="puzzle-tile" data-puzzle="week9" href="?puzzle=week9">9</a>
            <a class="puzzle-tile" data-puzzle="week10" href="?puzzle=week10">10</a>
            <a class="puzzle-tile" data-puzzle="week11" href="?puzzle=week11">11</a>
            <a class="puzzle-tile" data-puzzle="week12" href="?puzzle=week12">12</a>
            <a class="puzzle-tile" data-puzzle="week13" href="?puzzle=week13">13</a>
            <a class="puzzle-tile" data-puzzle="week14" href="?puzzle=week14">14</a>
            <a class="puzzle-tile" data-puzzle="week15" href="?puzzle=week15">15</a>
            <a class="puzzle-tile" data-puzzle="week16" href="?puzzle=week16">16</a>
            <a class="puzzle-tile" data-puzzle="week17" href="?puzzle=week17">17</a>
            <a class="puzzle-tile" data-puzzle="week18" href="?puzzle=week18">18</a>
            <a class="puzzle-tile" data-puzzle="week19" href="?puzzle=week19">19</a>
            <a class="puzzle-tile" data-puzzle="week20" href="?puzzle=week20">20</a>
            <a class="puzzle-tile" data-puzzle="week21" href="?puzzle=week21">21</a>
            <a class="puzzle-tile" data-puzzle="week22" href="?puzzle=week22">22</a>
            <a class="puzzle-tile" data-puzzle="week23" href="?puzzle=week23">23</a>
            <a class="puzzle-tile" data-puzzle="week24" href="?puzzle=week24">24</a>
            <a class="puzzle-tile" data-puzzle="week25" href="?puzzle=week25">25</a>
            <a class="puzzle-tile" data-puzzle="week26" href="?puzzle=week26">26</a>
            <a class="puzzle-tile" data-puzzle="week27" href="?puzzle=week27">27</a>
            <a class="puzzle-tile" data-puzzle="week28" href="?puzzle=week28">28</a>
            <a class="puzzle-tile" data-puzzle="week29" href="?puzzle=week29">29</a>
            <a class="puzzle-tile" data-puzzle="week30" href="?puzzle=week30">30</a>
            <a class="puzzle-tile" data-puzzle="week31" href="?puzzle=week31">31</a>
            <a class="puzzle-tile" data-puzzle="week32" href="?puzzle=week32">32</a>
            <a class="puzzle-tile" data-puzzle="week33" href="?puzzle=week33">33</a>

            <a class="puzzle-tile" data-puzzle="week36" href="?puzzle=week36">36</a>
        </div>
    </nav>

    <div class="timer-container">Time: <span id="timer">00:00</span></div>

    <main class="game-container" id="game" hidden>
        <div class="crossword-grid" id="grid" role="grid" aria-label="Crossword grid"></div>

        <div class="clues-container hidden-clues" id="clues-wrapper">
            <div class="start-overlay" id="overlay">
                <button class="btn-start" id="start-btn" type="button">Start Puzzle</button>
            </div>

            <section class="clue-section">
                <h2>Across</h2>
                <ul class="clue-list" id="across-clues"></ul>
            </section>
            <section class="clue-section">
                <h2>Down</h2>
                <ul class="clue-list" id="down-clues"></ul>
            </section>
        </div>
    </main>

    <div class="controls" id="controls" hidden>
        <div class="puzzle-controls">
            <button class="btn-check" id="check-btn" type="button" disabled>Check Puzzle</button>
            <button class="btn-reveal" id="reveal-btn" type="button" disabled>Reveal Tile</button>
            <button class="btn-reset" id="reset-btn" type="button">Reset</button>
        </div>
        <div class="feedback-options">
            <a class="button-link btn-feedback" href="https://docs.google.com/forms/d/e/1FAIpQLSdEkksD2E3fPwQI0q9jJVvUVULORspFTuo5K-cKJL17OnD6Ng/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer">Submit a bug report or suggestion</a>
            <small>Or email <a href="mailto:iwang@imsa.edu">iwang@imsa.edu</a> or <a href="mailto:acole@imsa.edu">acole@imsa.edu</a></small>
        </div>
    </div>
    <p class="message" id="message" role="alert">Loading crossword&hellip;</p>

    <script src="../assets/crossword.js"></script>
</body>
</html>
